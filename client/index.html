    <script>
      (function () {
        try {
          var t = localStorage.getItem('jp_theme');
          if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
          // Skin (see src/skins/registry.js): the stylesheet itself is
          // loaded by main.jsx, this just tags the root early.
          var s = localStorage.getItem('jp_skin');
          if (s) document.documentElement.setAttribute('data-skin', s);
          var loc = localStorage.getItem('jp_locale');
          if (loc) document.documentElement.setAttribute('data-locale', loc);
        } catch (e) {
          /* localStorage unavailable — fall back to system preference via CSS media query */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font families are per skin; registry.js adds the stylesheet link. -->
    <style id="boot-bg">
      /* Until the skin stylesheet arrives (it's loaded before first render),
         match the page background to the light/dark mode so there's no flash. */
      html { background: #faf6ef; }
      html[data-theme="dark"] { background: #0c0b10; }
      @media (prefers-color-scheme: dark) { html:not([data-theme="light"]) { background: #0c0b10; } }
    </style>
