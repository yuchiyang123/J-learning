name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        shell: pwsh
        run: git -C "D:\練習\50" pull --ff-only

      - name: Install server deps
        shell: pwsh
        working-directory: D:\練習\50\server
        run: npm ci

      - name: Install client deps
        shell: pwsh
        working-directory: D:\練習\50\client
        run: npm ci

      - name: Build client
        shell: pwsh
        working-directory: D:\練習\50\client
        run: npm run build
