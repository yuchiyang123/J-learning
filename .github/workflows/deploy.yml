name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest
        shell: powershell
        run: git -C "D:\jlearn" pull --ff-only

      - name: Install server deps
        shell: powershell
        working-directory: D:\jlearn\server
        run: npm ci

      - name: Install client deps
        shell: powershell
        working-directory: D:\jlearn\client
        run: npm ci

      - name: Build client
        shell: powershell
        working-directory: D:\jlearn\client
        run: npm run build
