name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    # Moved off the old Windows box (native Node + Windows Service) onto the
    # new Linux host, where this app runs as a Docker container instead —
    # see docker-compose.yml. Label-scoped so this can never accidentally
    # land on some other self-hosted runner.
    runs-on: [self-hosted, linux, jlearn]
    steps:
      - name: Pull latest
        run: git -C ~/projects/J-learning pull --ff-only

      - name: Install server deps
        working-directory: /home/bospoel/projects/J-learning/server
        run: npm ci

      - name: Lint server
        working-directory: /home/bospoel/projects/J-learning/server
        run: npm run lint

      - name: Install client deps
        working-directory: /home/bospoel/projects/J-learning/client
        run: npm ci

      - name: Lint client
        working-directory: /home/bospoel/projects/J-learning/client
        run: npm run lint

      # Rebuilds the image (server + client bundle) and recreates the
      # container; the SQLite db lives in the jlearn-data volume so it
      # survives the recreate untouched.
      - name: Build & deploy via Docker
        run: |
          cd ~/projects/J-learning
          docker compose up -d --build
          docker image prune -f
